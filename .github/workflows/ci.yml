name: Validate workflow kit

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Full history: the migration test installs the last 0.1 revision.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify required tools
        run: |
          # rsync is only needed by the 0.1 installer used in the migration test.
          command -v bash git node npm tar rsync
          node --version

      - name: Run workflow-kit tests
        run: bash tests/run.sh

      - name: Verify publication archive
        run: bash tests/publication-candidate.sh

      - name: Verify npm package contents
        run: npm pack --dry-run
